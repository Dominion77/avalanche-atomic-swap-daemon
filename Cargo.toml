[package]
name = "avalanche-atomic-swap-daemon"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Lord Herrschaft"]
description = "Production HTLC atomic swap daemon (C-Chain ↔ any Subnet-EVM) — bidirectional + Prometheus"

[dependencies]
alloy = { version = "1", features = ["full", "reqwest", "ws", "signer-local", "rpc-types-eth"] }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
eyre = "0.6"
hex = "0.4"
url = "2"
reqwest = { version = "0.12", features = ["json"] }
prometheus = "0.13"
axum = { version = "0.7", features = ["tokio"] }
once_cell = "1.19"