[package]
name = "avalanche-atomic-swap-daemon"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Lord Herrschaft"]
description = "Production-ready HTLC atomic swap daemon for Avalanche C-Chain and Subnet-EVM chains with bidirectional support and Prometheus metrics"
repository = "https://github.com/Dominion77/avalanche-atomic-swap-daemon"
homepage = "https://github.com/Dominion77/avalanche-atomic-swap-daemon"
documentation = "https://docs.rs/avalanche-atomic-swap-daemon"
readme = "README.md"
keywords = ["avalanche", "atomic-swap", "htlc", "blockchain", "defi"]
categories = ["cryptography::cryptocurrencies", "network-programming"]
rust-version = "1.75"

[dependencies]
alloy = { version = "0.8", features = ["full", "node-bindings", "provider-http", "signer-local", "contract"] }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
eyre = "0.6"
hex = "0.4"
url = "2"
reqwest = { version = "0.12", features = ["json"] }
prometheus = "0.13"
axum = { version = "0.7", features = ["tokio"] }
once_cell = "1.19"
dotenvy = "0.15"
serde_json = "1.0"